# Auto-deploy to the Supabase DEV project on every merge to main that touches
# supabase/. Exists because the paper soak drifted from main twice in one week
# (4 unpushed migrations found during the #256 deploy; a stale pre-#237
# kill-switch "protected" a phantom position for 3 sessions — see the soak
# post-mortem issue). The soak only validates what is actually deployed.
#
# PROD (yomamlrozydhgleumnon) is deliberately NOT touched here — go-live (#230)
# stays a manual, runbook-driven step.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_ACCESS_TOKEN  - personal access token (dedicated token recommended)
#   SUPABASE_DB_PASSWORD   - dev project database password (for db push)
name: deploy-dev

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
  pull_request:

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: false

env:
  # Dev / paper project (trading-bot-dev). Live keys never touch this workflow.
  PROJECT_REF: qdaxxsuicyiscdvsdowc

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.2
      - run: deno task test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: pip install -r requirements.txt
      - run: pytest -m "not slow"

  deploy:
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v2.1.1
        with:
          version: 2.98.2

      # Order matters (#256 final-review finding): functions BEFORE db push.
      # New function + old cron is fail-closed (clock gate / stale guard);
      # new cron + old function could trade on a partial bar during RTH.
      - name: Deploy functions (JWT-verified)
        run: supabase functions deploy daily-check kill-switch hourly-check --project-ref "$PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy panic (x-panic-token auth, no JWT)
        run: supabase functions deploy panic --no-verify-jwt --project-ref "$PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Read-only (#354): no mutating broker helper, no DB writes. The
      # one-time STATUS_TOKEN secret stays a documented operator step
      # (supabase secrets set) — this deploy alone doesn't require it.
      - name: Deploy status (x-status-token auth, no JWT, read-only)
        run: supabase functions deploy status --no-verify-jwt --project-ref "$PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Apply migrations
        run: |
          supabase link --project-ref "$PROJECT_REF"
          supabase db push -p "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # #602: post-deploy smoke test. Calls the status Edge Function with
      # `?verify=<yesterday>` to exercise the full verification path (including
      # the pg_net_timeout_count RPC). Fails the deploy job on any non-2xx,
      # catching regressions where a function is deployed but its migration
      # wasn't applied (the original #602 bug: the RPC crashed because pg_net
      # was missing). Uses the same STATUS_URL/STATUS_TOKEN secrets as
      # daily-verification.yml and heartbeat.yml. Silent skip when the secrets
      # are unset (pre-go-live, dev-only) so this never blocks a first deploy.
      - name: Smoke test -- status?verify=<yesterday>
        run: |
          if [ -z "$STATUS_URL" ] || [ -z "$STATUS_TOKEN" ]; then
            echo "::notice::Smoke test skipped -- STATUS_URL and/or STATUS_TOKEN repo secrets are not set. See docs/runbooks/status-check.md."
            exit 0
          fi
          YESTERDAY="$(date -u -d yesterday +%F)"
          echo "Smoking status?verify=$YESTERDAY ..."
          curl --fail-with-body -sS --max-time 60 \
            -H "x-status-token: $STATUS_TOKEN" \
            "$STATUS_URL?verify=$YESTERDAY" >/dev/null
          echo "Smoke test passed."
        env:
          STATUS_URL: ${{ secrets.STATUS_URL }}
          STATUS_TOKEN: ${{ secrets.STATUS_TOKEN }}
