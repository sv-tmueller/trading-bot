# Weekly off-platform backup of the dev/paper Supabase project's row data
# (audit_log, regime_state, trades, bot_config). Exists because Supabase
# Free/Hobby tier has no automated backups and pauses/deletes inactive
# projects — schema is safe in git (supabase/migrations/), but row data is
# not. See docs/decisions/2026-07-07-supabase-row-data-backup.md for the
# full evaluation; this workflow implements the zero-new-cost option.
#
# Inert by default: if BACKUP_ENCRYPTION_KEY, SUPABASE_ACCESS_TOKEN, or
# SUPABASE_DB_PASSWORD are unset, the check step notices and exits 0 without
# touching Supabase. See "Operator steps" in the PR body / ADR for how to
# turn this on.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions) to
# enable — SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD already exist for
# deploy-dev.yml and are reused here; only BACKUP_ENCRYPTION_KEY is new:
#   SUPABASE_ACCESS_TOKEN   - personal access token (same as deploy-dev.yml)
#   SUPABASE_DB_PASSWORD    - dev project database password (same as deploy-dev.yml)
#   BACKUP_ENCRYPTION_KEY   - symmetric passphrase for the dump (e.g. `openssl rand -base64 32`)
name: backup-db

on:
  schedule:
    - cron: "0 6 * * 0" # weekly, Sunday 06:00 UTC
  workflow_dispatch:

concurrency:
  group: backup-db
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Dev / paper project (trading-bot-dev). Prod is not yet deployed (see
  # docs/CURRENT_CONFIG.md) — this backs up the only data that currently
  # exists.
  PROJECT_REF: qdaxxsuicyiscdvsdowc

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check secrets configured
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$BACKUP_ENCRYPTION_KEY" ]; then
            echo "::notice::backup-db is inert — SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, and/or BACKUP_ENCRYPTION_KEY are not set. See docs/decisions/2026-07-07-supabase-row-data-backup.md for setup steps. Skipping."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}

      - uses: supabase/setup-cli@v2.1.1
        if: steps.check.outputs.configured == 'true'
        with:
          version: 2.98.2

      - name: Dump row data
        if: steps.check.outputs.configured == 'true'
        run: |
          supabase link --project-ref "$PROJECT_REF"
          supabase db dump --data-only -p "$SUPABASE_DB_PASSWORD" -f dump.sql
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Encrypt dump
        if: steps.check.outputs.configured == 'true'
        run: |
          mkdir -p backups
          openssl enc -aes-256-cbc -pbkdf2 -salt -in dump.sql -out backups/db-dump-latest.sql.enc -pass env:BACKUP_ENCRYPTION_KEY
          rm dump.sql
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}

      - name: Commit encrypted dump
        if: steps.check.outputs.configured == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/db-dump-latest.sql.enc
          if git diff --cached --quiet; then
            echo "No change in dump contents — nothing to commit"
          else
            git commit -m "chore: weekly encrypted db-dump backup"
            git push
          fi
