# Weekly research review: renders the state of the strategy-search programme from the
# tested-cell ledger, commits it to docs/research/reviews/YYYY-Www.md, and opens one issue
# per week carrying the mechanically-derived next-round proposal.
#
# This is the self-improvement loop's scheduled half. The generator
# (backtest/weekly_review.py) is DETERMINISTIC and fully offline — no LLM, no network, no
# secrets — so this workflow needs no configuration and cannot fail on a missing credential.
# That is deliberate: a review that only runs when a secret is set is a review that silently
# stops running.
#
# Why Saturday 06:00 UTC: after the US trading week has fully closed (Friday 21:00 UTC),
# so the ISO week the review is labelled with is complete. Deliberately NOT Sunday — the
# db-dump backup already holds Sunday 06:00 and staggering avoids two committing workflows
# racing for the same ref.
#
# Idempotence / dedup / supersession (#662):
#   - The doc write is idempotent: re-running in the same ISO week regenerates the same file
#     (the generator is deterministic), and the commit step no-ops when nothing changed.
#   - The issue is deduped by title: a title search first, then a non-search open-issue list
#     as a fallback (search can lag just after a create), so a re-run finds the existing issue
#     for this week rather than opening a duplicate.
#   - Exactly one weekly-review issue is meant to be open at a time. After finding-or-creating
#     this week's issue, a separate step fetches every open issue, hands them to
#     backtest/review_issues.py (pure, offline, unit-tested), and closes whatever it names as
#     superseded -- an older week, a same-week duplicate, or a stale backfill. The helper's
#     first output line names the issue to KEEP (number + week label); a backfill run's own
#     issue can itself be the one that closes, so the close comment/log always names that
#     KEPT issue, never this run's own `$ISSUE_NUMBER` (#666 review finding 1). A close
#     failure fails the run rather than silently leaving a stale issue open.
#
# Judgement deliberately lives OUTSIDE this workflow. The generator does the accounting and
# applies a documented priority rule; deciding whether to act on the proposal is a human (or
# agent) call made on the issue this opens.

name: weekly-research-review

on:
  schedule:
    - cron: "0 6 * * 6" # weekly, Saturday 06:00 UTC (after the US week closes)
  workflow_dispatch:
    inputs:
      as_of:
        description: "Date inside the target ISO week (YYYY-MM-DD). Defaults to today."
        required: false
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  # Never let two runs commit to the same ref simultaneously.
  group: weekly-research-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # The generator imports only the stdlib and backtest.tested_cells (a Python literal),
      # so requirements.txt is deliberately NOT installed — nothing here needs pandas.

      - name: Resolve target ISO week
        id: week
        run: |
          AS_OF="${{ inputs.as_of }}"
          if [ -z "$AS_OF" ]; then AS_OF="$(date -u +%F)"; fi
          LABEL="$(python -c "
          import datetime, sys
          d = datetime.date.fromisoformat(sys.argv[1])
          y, w, _ = d.isocalendar()
          print(f'{y}-W{w:02d}')
          " "$AS_OF")"
          echo "as_of=$AS_OF" >> "$GITHUB_OUTPUT"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"
          echo "Target: $LABEL (as of $AS_OF)"

      - name: Render the review
        run: |
          python -m backtest.weekly_review \
            --as-of "${{ steps.week.outputs.as_of }}" \
            --out "docs/research/reviews/${{ steps.week.outputs.label }}.md"

      - name: Commit the review (no-op when unchanged)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "docs/research/reviews/${{ steps.week.outputs.label }}.md"
          if git diff --cached --quiet; then
            echo "No change — the ledger has not moved since the last render. Nothing to commit."
            exit 0
          fi
          git commit -m "docs: research review ${{ steps.week.outputs.label }}"
          git push

      - name: Find or create this week's proposal issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ steps.week.outputs.label }}
        run: |
          set -euo pipefail
          TITLE="Research review $LABEL — next-round proposal"

          # Primary dedup: title search. Fast, but can lag just after a create. The `first`
          # is picked inside jq, not piped through `head -1` -- under `pipefail`, `head -1`
          # closing the pipe early on 2+ matches (same-week duplicates) sends the upstream
          # `gh` a SIGPIPE, which exits 141 and fails the run.
          EXISTING="$(gh issue list --search "$TITLE in:title" --state all \
                        --json number,title \
                        --jq "[.[] | select(.title == \"$TITLE\") | .number] | first // empty")"

          # Fallback: the non-search open-issue list, in case search lag hides a
          # just-created issue (#662 risk note).
          if [ -z "$EXISTING" ]; then
            EXISTING="$(gh issue list --state open --json number,title --limit 200 \
                          --jq "[.[] | select(.title == \"$TITLE\") | .number] | first // empty")"
          fi

          if [ -n "$EXISTING" ]; then
            echo "Issue #$EXISTING already exists for $LABEL -- reusing it."
            echo "number=$EXISTING" >> "$GITHUB_OUTPUT"
            echo "state=existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BODY_FILE="$(mktemp)"
          {
            echo "Automated weekly research review for **$LABEL**."
            echo
            echo "Rendered from the tested-cell ledger by \`backtest/weekly_review.py\`."
            echo "Full review: \`docs/research/reviews/$LABEL.md\`"
            echo
            echo "---"
            echo
            sed -n '/^## Proposed next round/,/^## Standing reminders/p' \
              "docs/research/reviews/$LABEL.md" | sed '$d'
            echo
            echo "---"
            echo
            echo "The proposal above is **mechanical** — it applies a documented priority rule to"
            echo "the ledger. Whether to act on it is a judgement call, and that judgement belongs"
            echo "in this thread, not in the generator."
            echo
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
          } > "$BODY_FILE"

          CREATED_URL="$(gh issue create --title "$TITLE" --body-file "$BODY_FILE" --label enhancement)"
          CREATED_NUMBER="${CREATED_URL##*/}"
          case "$CREATED_NUMBER" in
            ''|*[!0-9]*)
              echo "::error::gh issue create did not return a numeric issue number: $CREATED_URL"
              exit 1
              ;;
          esac
          echo "Created issue #$CREATED_NUMBER for $LABEL."
          echo "number=$CREATED_NUMBER" >> "$GITHUB_OUTPUT"
          echo "state=created" >> "$GITHUB_OUTPUT"

      - name: Close superseded review issues
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ steps.week.outputs.label }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          set -euo pipefail
          DECISION="$(gh issue list --state open --json number,title --limit 200 \
                        | python -m backtest.review_issues \
                            --current-number "$ISSUE_NUMBER" --current-label "$LABEL")"

          # First line is always "keep <N> <LABEL>" -- the issue to KEEP, which is not
          # always this run's own $ISSUE_NUMBER (a backfill can close its own issue while an
          # already-open newer week is kept; see backtest/review_issues.py's decide()).
          KEEP_LINE="$(echo "$DECISION" | head -1)"
          KEEP_NUMBER="$(echo "$KEEP_LINE" | awk '{print $2}')"
          KEEP_LABEL="$(echo "$KEEP_LINE" | awk '{print $3}')"
          TO_CLOSE="$(echo "$DECISION" | tail -n +2)"

          if [ -z "$TO_CLOSE" ]; then
            echo "Nothing superseded -- no issue to close."
            exit 0
          fi

          echo "$TO_CLOSE" | while IFS= read -r N; do
            [ -z "$N" ] && continue
            echo "Closing superseded issue #$N (kept #$KEEP_NUMBER, $KEEP_LABEL)."
            gh issue close "$N" --reason "not planned" \
              --comment "Superseded by #$KEEP_NUMBER (Research review $KEEP_LABEL). Exactly one weekly research-review proposal stays open at a time -- see #662."
          done
