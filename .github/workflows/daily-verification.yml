# Daily verification: runs the soak-day SQL ritual mechanically instead of by
# hand (#535's closing question). Fetches the `status?verify=YYYY-MM-DD`
# digest (#546), pipes it through the pure evaluator `scripts/daily_verify.ts`
# (#547), commits the two artifacts it writes, posts one Discord line, and
# opens a dated issue on FAIL. See
# docs/superpowers/specs/2026-08-06-daily-verification-design.md and
# docs/runbooks/daily-verification.md for the full design and operator guide.
#
# Structured on deadman-watchdog.yml (silence flag, loud-fail dev secrets,
# never print the raw digest) crossed with weekly-research-review.yml's
# commit-idempotently and dedup-issue-by-title idioms. Deliberately NOT
# scripts/deadman_latch.sh: a bad trading day is a dated event, not an
# ongoing incident, and that script posts its own Discord message, which
# would duplicate the one line this workflow already sends every run.
#
# Schedule: 22:15 UTC weekdays, after kill-switch's final 21:55 slot has
# landed. Plus workflow_dispatch with an optional `date` input, so a specific
# day can be backfilled one at a time (`audit_log` and `hourly_scans` hold
# 2026-08-03 onward).
#
# Date resolution happens here in the workflow's shell, not in the script:
# the resolved date is needed before the `status?verify=<date>` URL can be
# built, and the pipeline is fetch-then-pipe, so nothing downstream of the
# fetch can supply it. `workflow_dispatch`'s `date` input is used verbatim;
# otherwise today in UTC when the UTC hour is 12 or later, else the previous
# UTC day (the 22:15 schedule is far enough from midnight that ordinary
# Actions jitter never crosses the boundary the wrong way). The weekend
# judgment itself (SKIPPED_WEEKEND) stays in the script's tested pure layer --
# this workflow always resolves a date, always fetches, always pipes, and
# trusts the stdout verdict.
#
# Green versus red: any verdict the evaluator reaches -- PASS, WARN, FAIL, or
# SKIPPED_WEEKEND -- exits this run green, because the dated issue plus the
# Discord line ARE the signal (deadman's own rule, for deadman's reason). Red
# is reserved for workflow-internal failure only:
#   - missing dev secrets (loud ::error::, never a silent skip)
#   - a failed digest fetch (deliberately NOT softened into a finding --
#     the frozen stdout envelope has no vocabulary for "could not fetch", so
#     a curl failure propagates under Actions' default `bash -eo pipefail`)
#   - the evaluator exiting 1 (malformed input -- no JSON printed, nothing
#     written)
#   - a failed commit or push
#   - a failed Discord post
# Step order is evaluate, commit, Discord, issue, so a commit failure can't
# still send a line describing artifacts that never reached the repo.
#
# The evaluator's exit code 2 (FAIL) must NOT propagate under Actions'
# default errexit -- hence the `set +e` capture-then-branch idiom below,
# mirroring deadman's own "Evaluate" steps.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions), all
# already configured for deadman-watchdog.yml (STATUS_URL/STATUS_TOKEN also
# for heartbeat.yml) -- no new secret is introduced by this workflow:
#   STATUS_URL / STATUS_TOKEN   - dev status function (loud-fail if missing)
#   NOTIFY_WEBHOOK_URL          - Discord incoming webhook
#
# Optional repo secrets (reflection wiring, #583) -- read-only Alpaca
# market-data keys, mapped to the "Fetch SPY 5Min bars" step ONLY, never a
# broker order credential:
#   ALPACA_API_KEY / ALPACA_SECRET_KEY
# Absent (unset) is a supported, silent-to-the-verdict degrade, not a
# misconfiguration: the fetch step warns and the day's reflection section
# degrades to the engine's own error-day markdown. See
# docs/runbooks/daily-verification.md for the `gh secret set` commands.
#
# Prod leg: an INERT NOTICE ONLY, permanently -- this deliberately does NOT
# mirror deadman-watchdog.yml/heartbeat.yml, whose prod legs become full
# symmetric pipelines once STATUS_URL_PROD/STATUS_TOKEN_PROD are set. Those
# two workflows write no repo files; this one does, and the artifact schema
# (docs/trading-journal/daily-verification.jsonl and
# docs/trading-journal/daily/<date>.md) is keyed by date alone with no
# environment dimension. A live prod leg would silently clobber the dev
# leg's ledger row and digest for the same calendar date, whichever ran
# second. Activating prod needs the artifact schema namespaced per
# environment first -- out of scope here, tracked as a follow-up ahead of
# #230. See docs/runbooks/daily-verification.md for the full caveat.
#
# Maintenance silence: repo variable DAILY_VERIFY_SILENCED set to exactly
# `true` short-circuits every step to a green ::notice:: exit (same idiom as
# DEADMAN_SILENCED). Unset it (or set it to anything else) to re-arm.
#
# Never prints the raw status digest (it carries account and position data).
# Only the evaluator's own stdout envelope (verdict, summary, findings,
# artifact paths) reaches the log.
#
# Reflection wiring (#583): between "Evaluate day" and "Commit artifacts", four
# GATED, NEVER-RED steps wire the frozen nightly-reflection engine
# (backtest/reflection.py, #578) onto the same two artifacts the evaluator just
# wrote -- setup-python + pip install, a SPY 5Min bars fetch, the prior-ledger
# filter + engine run, and the glue apply (scripts/apply_reflection.ts). All
# four are gated on the "Evaluate day" step's own `reflect` output (off on
# SKIPPED_WEEKEND -- no artifacts exist to reflect onto) and every one degrades
# instead of failing the job (continue-on-error on setup-python, capture-then-warn
# on the rest): a pip/fetch/engine flake never reds a healthy seven-check day,
# it only costs that day's reflection section, which either degrades to the
# engine's own frozen error-day markdown or, if the engine's envelope never
# reaches disk at all, a glue-authored fallback section (scripts/apply_reflection.ts's
# fallbackReflectionMarkdown) -- a reflection section is never silently dropped.
# Two deliberate deviations, disclosed here rather than left implicit:
#   - The bars fetch passes an explicit `--end=<date>T21:00:00Z` rather than
#     backtest/run_fetch_spy_intraday.py's own "previous UTC day" CLI default --
#     that default is the multi-year research-study convention and would
#     exclude the target day entirely here. 21:00Z covers the last regular-session
#     5Min bar in both DST regimes while sitting 75+ minutes clear of the
#     recent-SIP embargo at this workflow's own 22:15Z schedule.
#   - "Reflection unavailable: ..." (scripts/apply_reflection.ts's fallback
#     wording, used only when the engine's own envelope file never lands) is
#     GLUE vocabulary, not the frozen engine contract -- never confuse it with
#     backtest/reflection.py's own `"Reflection: error -- <reason>"` line, which
#     is the engine's documented degrade output and reaches disk in the
#     ordinary case (a missing/malformed bars file, an unresolvable trade).
# See docs/runbooks/daily-verification.md's reflection section for the operator
# view (required/optional secrets, degraded behaviour, backfill caveats).
#
# FAIL dedup: one issue per date, deduped by exact title against
# `--state all`, following weekly-research-review.yml's idiom (not
# deadman_latch.sh's open/close latch -- a bad trading day is a dated event,
# not an ongoing incident that "recovers").
#
# This repo is PUBLIC: forks get none of the secrets above, and GitHub
# disables scheduled workflows on forks by default, so a fork's copy of this
# workflow is inert.
name: daily-verification

on:
  schedule:
    - cron: "15 22 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Trading day to verify (YYYY-MM-DD). Defaults to today (UTC hour >= 12) or yesterday otherwise."
        required: false
        type: string

concurrency:
  group: daily-verification
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check silence flag
        id: silence
        run: |
          if [ "$DAILY_VERIFY_SILENCED" = "true" ]; then
            echo "::notice::daily-verification is silenced (DAILY_VERIFY_SILENCED=true repo variable). Skipping this run. Unset the variable to re-arm. See docs/runbooks/daily-verification.md."
            echo "silenced=true" >> "$GITHUB_OUTPUT"
          else
            echo "silenced=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          DAILY_VERIFY_SILENCED: ${{ vars.DAILY_VERIFY_SILENCED }}

      - name: Checkout
        if: steps.silence.outputs.silenced != 'true'
        uses: actions/checkout@v5

      - name: Setup Deno
        if: steps.silence.outputs.silenced != 'true'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check dev secrets configured
        id: check_dev
        if: steps.silence.outputs.silenced != 'true'
        run: |
          if [ -z "$STATUS_URL" ] || [ -z "$STATUS_TOKEN" ]; then
            echo "::error::daily-verification requires STATUS_URL and STATUS_TOKEN repo secrets to be set (Settings -> Secrets and variables -> Actions). See docs/runbooks/daily-verification.md. Failing loudly -- no silent skip."
            exit 1
          fi
        env:
          STATUS_URL: ${{ secrets.STATUS_URL }}
          STATUS_TOKEN: ${{ secrets.STATUS_TOKEN }}

      - name: Resolve target date
        id: date
        if: steps.silence.outputs.silenced != 'true'
        run: |
          DATE="${{ inputs.date }}"
          if [ -z "$DATE" ]; then
            HOUR="$(date -u +%H)"
            if [ "$HOUR" -ge 12 ]; then
              DATE="$(date -u +%F)"
            else
              DATE="$(date -u -d yesterday +%F)"
            fi
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "Resolved target date: $DATE"

      # A curl failure here is deliberately NOT softened into a finding: the
      # frozen stdout envelope (spec §5.5) has no vocabulary for "could not
      # fetch the digest", so this propagates under `bash -eo pipefail` and
      # reds the run, per the green/red contract above.
      - name: Fetch dev digest
        if: steps.silence.outputs.silenced != 'true'
        run: |
          curl --fail-with-body -sS --max-time 60 --retry 2 \
            -H "x-status-token: $STATUS_TOKEN" \
            "$STATUS_URL?verify=$DATE" -o digest.json
        env:
          STATUS_URL: ${{ secrets.STATUS_URL }}
          STATUS_TOKEN: ${{ secrets.STATUS_TOKEN }}
          DATE: ${{ steps.date.outputs.date }}

      # capture-then-branch: exit code 2 (FAIL) must stay green, exit code 1
      # (malformed input) must red the run. `set +e` around the invocation
      # keeps the FAIL case from tripping this step's own errexit.
      - name: Evaluate day
        id: evaluate
        if: steps.silence.outputs.silenced != 'true'
        run: |
          set +e
          OUT=$(deno run --allow-read=docs/trading-journal --allow-write=docs/trading-journal \
            scripts/daily_verify.ts --date="$DATE" < digest.json)
          CODE=$?
          set -e
          if [ "$CODE" -eq 1 ]; then
            echo "::error::daily-verification: scripts/daily_verify.ts exited 1 (malformed input) for $DATE -- see the script's stderr above for detail."
            exit 1
          fi
          if [ "$CODE" -ne 0 ] && [ "$CODE" -ne 2 ]; then
            echo "::error::daily-verification: scripts/daily_verify.ts exited unexpected code $CODE for $DATE."
            exit 1
          fi
          echo "$OUT" > verify-result.json
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          # #583: gate the reflection steps off SKIPPED_WEEKEND -- no ledger
          # row or digest doc exists on that path for reflection to merge onto.
          VERDICT=$(jq -r '.verdict' verify-result.json)
          if [ "$VERDICT" = "SKIPPED_WEEKEND" ]; then
            echo "reflect=false" >> "$GITHUB_OUTPUT"
          else
            echo "reflect=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          DATE: ${{ steps.date.outputs.date }}

      # -----------------------------------------------------------------
      # Reflection wiring (#583) -- four gated, never-red steps. See the
      # header comment above for the full design and the two documented
      # deviations. None of these steps can red the run: setup-python uses
      # continue-on-error, the rest use the same set +e capture-then-warn
      # idiom as "Evaluate day" above, always exiting 0.
      # -----------------------------------------------------------------

      - name: Setup Python (reflection engine)
        id: setup_python
        if: steps.silence.outputs.silenced != 'true' && steps.evaluate.outputs.reflect == 'true'
        continue-on-error: true
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install reflection engine dependencies
        id: pip_install
        if: steps.silence.outputs.silenced != 'true' && steps.evaluate.outputs.reflect == 'true'
        continue-on-error: true
        run: pip install -r requirements.txt

      # Read-only Alpaca market-data GET, mirroring backtest/run_fetch_spy_intraday.py's
      # own contract: absent keys make the helper exit 1 after printing
      # DATA_BLOCKED (no file written); a reachable-but-failing network call
      # raises instead. Either way this step never reds the job -- the engine
      # step below runs regardless and degrades internally on a missing bars
      # file (compute_reflection's own documented error envelope, exit 0).
      - name: Fetch SPY 5Min bars (reflection)
        id: fetch_bars
        if: steps.silence.outputs.silenced != 'true' && steps.evaluate.outputs.reflect == 'true'
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/reflection"
          PYTHONPATH=. python backtest/run_fetch_spy_intraday.py \
            --symbol SPY --timeframes 5Min \
            --start "$DATE" --end "${DATE}T21:00:00Z" \
            --out-dir "$RUNNER_TEMP/reflection"
          CODE=$?
          set -e
          if [ "$CODE" -ne 0 ]; then
            echo "::warning::daily-verification: SPY 5Min bars fetch failed or was blocked (exit $CODE) for $DATE -- today's reflection will degrade to the engine's error-day line. This does not affect the seven-check verdict."
          fi
          exit 0
        env:
          DATE: ${{ steps.date.outputs.date }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}

      # Prior-ledger filter (scripts/apply_reflection.ts's own selectPriorLedgerRows
      # -- the engine's trailing-20 fold has no date cutoff, so the caller
      # must not hand it today's row or any later date) then the frozen engine
      # CLI itself. Both run best-effort inside one set +e block: if the
      # filter step fails the engine step is skipped (no ledger arg to give
      # it), and either way a missing envelope.json is exactly the case the
      # glue apply step's own fallback section handles.
      - name: Run reflection engine
        id: run_engine
        if: steps.silence.outputs.silenced != 'true' && steps.evaluate.outputs.reflect == 'true'
        run: |
          set +e
          (
            set -e
            deno run --allow-read=docs/trading-journal --allow-write="$RUNNER_TEMP" \
              scripts/apply_reflection.ts prior-ledger --date="$DATE" \
              --ledger=docs/trading-journal/daily-verification.jsonl \
              --out="$RUNNER_TEMP/reflection/prior-ledger.jsonl"
            PYTHONPATH=. python backtest/run_nightly_reflection.py \
              --date="$DATE" \
              --digest=digest.json \
              --bars="$RUNNER_TEMP/reflection/SPY_5min.csv" \
              --ledger="$RUNNER_TEMP/reflection/prior-ledger.jsonl" \
              > "$RUNNER_TEMP/reflection/envelope.json"
          )
          CODE=$?
          set -e
          if [ "$CODE" -ne 0 ]; then
            echo "::warning::daily-verification: reflection engine step failed (exit $CODE) for $DATE -- the glue apply step will fall back to a degraded reflection section. This does not affect the seven-check verdict."
          fi
          exit 0
        env:
          DATE: ${{ steps.date.outputs.date }}

      # Merges the engine's envelope (or, absent that, a glue-authored
      # fallback section naming the failure) onto the SAME two artifacts
      # "Evaluate day" just wrote -- riding the existing commit below.
      - name: Apply reflection to today's artifacts
        id: apply_reflection
        if: steps.silence.outputs.silenced != 'true' && steps.evaluate.outputs.reflect == 'true'
        run: |
          set +e
          deno run --allow-read=docs/trading-journal,"$RUNNER_TEMP" --allow-write=docs/trading-journal \
            scripts/apply_reflection.ts apply --date="$DATE" \
            --envelope="$RUNNER_TEMP/reflection/envelope.json"
          CODE=$?
          set -e
          if [ "$CODE" -ne 0 ]; then
            echo "::warning::daily-verification: glue apply step failed (exit $CODE) for $DATE -- today's reflection section/ledger merge may be incomplete. This does not affect the seven-check verdict."
          fi
          exit 0
        env:
          DATE: ${{ steps.date.outputs.date }}

      - name: Commit artifacts (no-op when unchanged)
        if: steps.silence.outputs.silenced != 'true'
        run: |
          LEDGER=$(jq -r '.artifacts.ledger // empty' verify-result.json)
          DIGEST=$(jq -r '.artifacts.digest // empty' verify-result.json)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -z "$LEDGER" ] && [ -z "$DIGEST" ]; then
            echo "No artifacts for this date (e.g. SKIPPED_WEEKEND). Nothing to commit."
            exit 0
          fi
          if [ -n "$LEDGER" ]; then git add "$LEDGER"; fi
          if [ -n "$DIGEST" ]; then git add "$DIGEST"; fi
          if git diff --cached --quiet; then
            echo "No change -- this date's verification re-rendered byte-identical output. Nothing to commit."
            exit 0
          fi
          COMMIT_DATE=$(jq -r '.date' verify-result.json)
          git commit -m "docs(daily-verify): verification for $COMMIT_DATE"
          git push

      # Exactly one Discord message per run, whatever the verdict (D7).
      # jq's `[0:2000]` slice is Unicode-codepoint-based, giving the same
      # safety property `_shared/notifications.ts`'s `truncateCodepoints`
      # gives the trading path, without importing it (CI acquires no
      # Supabase client).
      - name: Post Discord message
        if: steps.silence.outputs.silenced != 'true'
        run: |
          if [ -z "$NOTIFY_WEBHOOK_URL" ]; then
            echo "::error::daily-verification: NOTIFY_WEBHOOK_URL is unset -- cannot deliver the required Discord line. Failing the run red so this isn't silent."
            exit 1
          fi
          DATE=$(jq -r '.date' verify-result.json)
          VERDICT=$(jq -r '.verdict' verify-result.json)
          SUMMARY=$(jq -r '.summary' verify-result.json)
          FINDINGS=$(jq -r '.findings | if length > 0 then (map("- " + .) | join("\n")) else "" end' verify-result.json)
          MSG=$(jq -nr --arg date "$DATE" --arg verdict "$VERDICT" --arg summary "$SUMMARY" --arg findings "$FINDINGS" \
            '"[dev] Daily verify " + $date + ": " + $verdict + " -- " + $summary + (if $findings == "" then "" else "\n" + $findings end)')
          PAYLOAD=$(jq -n --arg content "$MSG" '{content: $content[0:2000]}')
          curl --fail-with-body -sS --max-time 30 \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$NOTIFY_WEBHOOK_URL" >/dev/null
        env:
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}

      # A gh API blip here is deliberately NOT allowed to red the run: by
      # this point the Discord line has already landed, so the day's signal
      # already reached the operator. `set +e` around the subshell (needed
      # because this step is several `gh` calls, not one) mirrors the
      # "Evaluate day" step's capture-then-branch idiom above, just wrapped
      # around a block instead of a single command.
      - name: Open FAIL issue (deduped by exact title)
        if: ${{ steps.silence.outputs.silenced != 'true' && steps.evaluate.outputs.code == '2' }}
        run: |
          set +e
          (
            set -e
            DATE=$(jq -r '.date' verify-result.json)
            N=$(jq -r '.findings | length' verify-result.json)
            TITLE="[daily-verify][dev] $DATE: $N finding(s)"

            # Idempotent -- never fails if the label already exists.
            gh label create daily-verify --color 5319E7 \
              --description "Daily verification FAIL for a specific trading day (#549)" \
              --force >/dev/null

            # Dedup: one issue per date, exact-title-matched so a near-title
            # cannot cause a false dedup.
            EXISTING="$(gh issue list --search "$TITLE in:title" --state all \
                          --json number,title \
                          --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)"
            if [ -n "$EXISTING" ]; then
              echo "Issue #$EXISTING already exists for $DATE -- no-op."
              exit 0
            fi

            DIGEST=$(jq -r '.artifacts.digest // empty' verify-result.json)
            BODY_FILE="$(mktemp)"
            {
              echo "Automated daily verification found $N finding(s) for **$DATE**."
              echo
              jq -r '.findings[] | "- " + .' verify-result.json
              echo
              echo "Digest: \`$DIGEST\`"
              echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            } > "$BODY_FILE"

            gh issue create --title "$TITLE" --body-file "$BODY_FILE" --label daily-verify
          )
          CODE=$?
          set -e
          if [ "$CODE" -ne 0 ]; then
            DATE=$(jq -r '.date' verify-result.json)
            echo "::warning::daily-verification: failed to open/dedupe the FAIL issue for $DATE (exit $CODE) -- the Discord line for this date already landed, so today's signal is not lost. See the step logs above for detail."
          fi
          exit 0

      # -----------------------------------------------------------------
      # Prod leg -- INERT NOTICE ONLY, permanently. See the header comment:
      # this never activates into a real pipeline, even once
      # STATUS_URL_PROD/STATUS_TOKEN_PROD are set, because the artifact
      # schema has no environment dimension. Gated on !cancelled() (not
      # success()) so a red dev leg can't skip this reminder.
      # -----------------------------------------------------------------
      - name: Prod leg (inert notice only)
        if: ${{ !cancelled() && steps.silence.outputs.silenced != 'true' }}
        run: |
          if [ -n "$STATUS_URL_PROD" ] && [ -n "$STATUS_TOKEN_PROD" ]; then
            echo "::notice::daily-verification (prod) stays intentionally inert even though STATUS_URL_PROD/STATUS_TOKEN_PROD are set. Activating a prod leg needs the artifact schema namespaced per environment first (see docs/runbooks/daily-verification.md's known caveats) -- do not build a symmetric prod pipeline here."
          else
            echo "::notice::daily-verification (prod) is inert -- STATUS_URL_PROD/STATUS_TOKEN_PROD are not configured. This leg is designed to never activate into a real pipeline, even once they are set. See docs/runbooks/daily-verification.md."
          fi
        env:
          STATUS_URL_PROD: ${{ secrets.STATUS_URL_PROD }}
          STATUS_TOKEN_PROD: ${{ secrets.STATUS_TOKEN_PROD }}
